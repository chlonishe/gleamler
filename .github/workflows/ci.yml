name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_TARGET_DIR: target

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -W warnings

      - name: Rust tests (via xtask)
        run: cargo xtask test --rust

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

      - name: cargo machete
        uses: bnjbvr/cargo-machete@main
        continue-on-error: true

  feature-matrix:
    name: Feature powerset (NIF versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check -p gleamler --feature-powerset --at-least-one-of nif_version_2_14,nif_version_2_15,nif_version_2_16,nif_version_2_17,nif_version_2_18 --lib

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov

      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

  gleam-test:
    name: Gleam / OTP matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            otp: "25"
            gleam: "1.14.0"
          - os: ubuntu-latest
            otp: "26"
            gleam: "1.14.0"
          - os: ubuntu-latest
            otp: "27"
            gleam: "1.14.0"
          - os: macos-latest
            otp: "27"
            gleam: "1.14.0"
          - os: windows-latest
            otp: "27"
            gleam: "1.14.0"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Erlang/OTP and Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: ${{ matrix.gleam }}
          rebar3-version: "3.22.1"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.otp }}-${{ matrix.gleam }}

      - name: Build NIF + FFI stubs + Gleam
        run: cargo xtask build --release --stress

      - name: Format generated code
        run: gleam format

      - name: Gleam format check
        run: gleam format --check

      - name: Gleam build
        run: gleam build

      - name: Gleam test
        run: gleam test

  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust tests under AddressSanitizer
        env:
          RUSTFLAGS: -Z sanitizer=address
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:print_stacktrace=1
        run: cargo +nightly test --target x86_64-unknown-linux-gnu -p gleamler --features stress

  miri:
    name: Miri (unsafe Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2

      - name: Miri setup
        run: cargo miri setup

      - name: Run Miri on gleamler
        run: cargo miri test -p gleamler --no-default-features --features nif_version_2_17
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-tree-borrows"

      - name: Run Miri on gleamler_codegen
        run: cargo miri test -p gleamler_codegen

      - name: Run Miri on gleamler_macros
        run: cargo miri test -p gleamler_macros

  valgrind-rust:
    name: Valgrind (Rust unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Build gleamler tests (debug)
        run: cargo test -p gleamler --features stress --no-run
      - name: Run Valgrind on gleamler test binary
        run: |
          cargo test -p gleamler --features stress --no-run --message-format=json > /tmp/cargo.json
          TEST_BIN=$(grep -o '"executable":"[^"]*gleamler-[^"]*"' /tmp/cargo.json | sed -E 's/.*"executable":"([^"]+)".*/\1/' | head -n 1 | tr -d '\n\r')
          if [ -z "$TEST_BIN" ] || [ ! -f "$TEST_BIN" ]; then
            echo "Error: Could not locate test binary from cargo metadata"
            exit 1
          fi
          echo "Valgrind target: $TEST_BIN"
          valgrind --leak-check=full --show-leak-kinds=definite,indirect --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 "$TEST_BIN" --test-threads=1

  valgrind-nif:
    name: Valgrind (NIF via Erlang VM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Erlang/OTP and Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.14.0"
          rebar3-version: "3"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Build everything
        run: cargo xtask build --release --stress

      - name: Compile leak test module
        run: |
          EBIN_DIR="build/dev/erlang/gleamler/ebin"
          mkdir -p "$EBIN_DIR"
          erlc -o "$EBIN_DIR" src/resource_leak_test.erl

      - name: Run resource leak test under Valgrind
        run: |
          EBIN_DIRS=$(find build/dev/erlang -name ebin | sed 's/^/-pa /' | tr '\n' ' ')
          echo "Using ebin dirs: $EBIN_DIRS"
          valgrind --leak-check=full --show-leak-kinds=definite,indirect --errors-for-leak-kinds=definite,indirect --error-exitcode=1 erl +S 1:1 -noshell $EBIN_DIRS -s resource_leak_test run -s init stop

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dry-run publish leaf crates
        run: |
          cargo publish -p gleamler_codegen --dry-run
          cargo publish -p gleamler_macros --dry-run
