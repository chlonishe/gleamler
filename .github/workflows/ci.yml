name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets -- -W warnings

      - run: cargo test -p gleamler --features stress
      - run: cargo test -p gleamler_codegen
      - run: cargo test -p gleamler_macros

  gleam-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nif_src: target/release/libgleamler.so
            nif_dst: priv/gleamler.so
          - os: macos-latest
            nif_src: target/release/libgleamler.dylib
            nif_dst: priv/gleamler.so
          - os: windows-latest
            nif_src: target/release/gleamler.dll
            nif_dst: priv/gleamler.dll

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Erlang/OTP and Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.14.0"
          rebar3-version: "3"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build Rust NIF (Unix)
        if: runner.os != 'Windows'
        run: |
          cargo build -p gleamler --release --features stress
          mkdir -p priv
          cp ${{ matrix.nif_src }} ${{ matrix.nif_dst }}

      - name: Build Rust NIF (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p gleamler --release --features stress
          New-Item -ItemType Directory -Force -Path priv | Out-Null
          Copy-Item ${{ matrix.nif_src }} ${{ matrix.nif_dst }}

      - name: Run Gleam tests
        run: gleam test

  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust tests under AddressSanitizer
        env:
          RUSTFLAGS: -Z sanitizer=address
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:print_stacktrace=1
        run: |
          cargo +nightly test -Zbuild-std \
            --target x86_64-unknown-linux-gnu \
            -p gleamler --features stress

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build gleamler tests (debug)
        run: cargo test -p gleamler --features stress --no-run
      - name: Run Valgrind on gleamler test binary
        run: |
          TEST_BIN=$(find target/debug/deps -maxdepth 1 -type f -executable -name 'gleamler-*' ! -name '*.d' | head -n 1)
          if [ -z "$TEST_BIN" ]; then
            echo "Error: Test binary not found!"
            exit 1
          fi
          echo "Valgrind target: $TEST_BIN"
          valgrind \
            --leak-check=full \
            --show-leak-kinds=definite,reachable \
            --track-origins=yes \
            --error-exitcode=1 \
            --suppressions=valgrind.supp \
            "$TEST_BIN" --test-threads=1