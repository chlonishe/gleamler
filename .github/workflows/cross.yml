name: Cross Compile & Smoke Test

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: libgleamler.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: libgleamler.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: gleamler.dll

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build -p gleamler --release --target ${{ matrix.target }} --features stress

      - name: Check symbols
        shell: bash
        run: ./scripts/check_nif.sh ${{ matrix.target }} target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v7
        with:
          name: gleamler-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  build-cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/install-action@cross

      - name: Build with cross
        env:
          RUSTFLAGS: "-C target-feature=-crt-static"
        run: cross build -p gleamler --release --target ${{ matrix.target }} --features stress

      - name: Check symbols
        run: ./scripts/check_nif.sh ${{ matrix.target }} target/${{ matrix.target }}/release/libgleamler.so

      - uses: actions/upload-artifact@v7
        with:
          name: gleamler-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/libgleamler.so

  gleam-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "latest"
          rebar3-version: "3"

      - name: Build NIF & Gleam
        run: cargo xtask build --release --stress

      - name: Gleam test
        run: gleam test
