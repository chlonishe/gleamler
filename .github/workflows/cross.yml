name: Cross Compile & Smoke Test

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: libgleamler.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: libgleamler.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: gleamler.dll

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build -p gleamler --release --target ${{ matrix.target }} --features stress

      - name: Check symbols
        shell: bash
        run: ./scripts/check_nif.sh ${{ matrix.target }} target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v5
        with:
          name: gleamler-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  build-cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu
            linker_var: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
            linker: aarch64-linux-gnu-gcc
            artifact: libgleamler.so
          - target: x86_64-unknown-linux-musl
            packages: musl-tools
            linker_var: CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
            linker: musl-gcc
            artifact: libgleamler.so
          - target: aarch64-unknown-linux-musl
            packages: gcc-aarch64-linux-gnu musl-tools
            linker_var: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER
            linker: aarch64-linux-gnu-gcc
            artifact: libgleamler.so

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Build
        env:
          ${{ matrix.linker_var }}: ${{ matrix.linker }}
        run: cargo build -p gleamler --release --target ${{ matrix.target }} --features stress

      - name: Check symbols
        run: ./scripts/check_nif.sh ${{ matrix.target }} target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: gleamler-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  gleam-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "latest"
          rebar3-version: "3"

      - name: Build NIF & Gleam (via xtask)
        run: cargo xtask build --release --stress

      - name: Gleam test
        run: gleam test
