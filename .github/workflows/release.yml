name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: gleamler-x86_64-linux.so
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset: gleamler-aarch64-linux.so
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: gleamler-x86_64-linux-musl.so
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset: gleamler-aarch64-linux-musl.so
          # macOS
          - target: x86_64-apple-darwin
            os: macos-13
            asset: gleamler-x86_64-macos.dylib
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: gleamler-aarch64-macos.dylib
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: gleamler-x86_64-windows.dll

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux cross-compiler
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)  sudo apt-get install -y gcc-aarch64-linux-gnu ;;
            x86_64-unknown-linux-musl)  sudo apt-get install -y musl-tools ;;
            aarch64-unknown-linux-musl) sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools ;;
          esac

      - name: Build
        run: cargo build -p gleamler --release --target ${{ matrix.target }} --features stress

      - name: Rename artifact
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *windows*) SRC="gleamler.dll" ;;
            *darwin*) SRC="libgleamler.dylib" ;;
            *)         SRC="libgleamler.so" ;;
          esac
          cp "target/${{ matrix.target }}/release/$SRC" "${{ matrix.asset }}"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
