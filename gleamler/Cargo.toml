[package]
name = "gleamler"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license = "MIT OR Apache-2.0"

[features]
default = ["nif_version_2_17"]
stress = []

# NIF version features form an implication chain: each higher version enables all lower ones
# The build script selects the highest active version. If you explicitly enable multiple
# versions, the maximum is used. Do not rely on enabling incompatible versions side-by-side
nif_version_2_14 = []
nif_version_2_15 = ["nif_version_2_14"]
nif_version_2_16 = ["nif_version_2_15"]
nif_version_2_17 = ["nif_version_2_16"]
nif_version_2_18 = ["nif_version_2_17"]
allocator = []
big_integer = ["num-bigint"]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
gleamler_macros = { path = "../gleamler_macros", version = "0.1.0" }
inventory = "0.3"
libloading = "0.9"
libc = "0.2"
num-bigint = { version = "0.5", optional = true }
ctor = "=0.6.0"
thiserror = "2.0.20"

[build-dependencies]
regex-lite = "0.1"
gleamler_codegen = { path = "../gleamler_codegen", version = "0.1.0" }
